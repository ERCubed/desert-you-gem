name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - run: bundle exec rake

  release:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      # Runs `bundle exec rake release`: tags the version (already tagged
      # locally via `rake bump:*`, so this is a no-op here), builds the gem,
      # and pushes it to rubygems.org using short-lived OIDC credentials --
      # no long-lived API key is stored in this repo.
      - uses: rubygems/release-gem@v1
